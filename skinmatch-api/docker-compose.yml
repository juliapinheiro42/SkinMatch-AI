services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://skinmatch:skinmatch@db:5432/skinmatch
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: skinmatch
      POSTGRES_PASSWORD: skinmatch
      POSTGRES_DB: skinmatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinmatch -d skinmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
